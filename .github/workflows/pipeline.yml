# The Copilot's own deployment pipeline. Every stage is deterministic; agents never gate.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# `shell: bash` runs with -eo pipefail (GitHub's implicit default is `bash -e` only).
# Actions are pinned by commit SHA (Node 24 versions) and the runner image is pinned:
# bump them on purpose, in their own PR.
defaults:
  run:
    shell: bash

jobs:
  commit:
    name: Commit stage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Validate agent configs
        run: python -m tools.agent_config agents
      - name: Unit tests (tools, skill map, eval harness, corpus integrity)
        run: pytest -q
      # Deterministic, so it may gate. HEAD is the PR merge commit, so diffing it against
      # the base gives exactly the PR. Excluded: files that quote injections on purpose.
      - name: Injection guard on this PR's diff
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git diff "origin/$BASE_REF" HEAD -- . \
            ':!evals/injection' ':!tests/test_injection_guard.py' \
            ':!agents/prompts' ':!README.md' > pr.diff
          python -m tools.injection_guard pr.diff

  acceptance:
    name: Acceptance stage (seeded-bug evals)
    needs: commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      # Iteration 1 swaps `oracle` for the real reviewer (e.g. reviewer.review:review).
      - run: python -m evals.runner --suite seeded-bugs --reviewer oracle --report eval-report.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: seeded-bugs-report
          path: eval-report.json

  security:
    name: Security stage (prompt-injection evals)
    needs: commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: python -m evals.runner --suite injection --reviewer oracle --report eval-report.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: injection-report
          path: eval-report.json

  # The real reviewer against both suites. Runs when the reviewer, its prompts or the
  # evals change, or on demand. Needs the ANTHROPIC_API_KEY secret; skipped without it.
  reviewer-evals:
    name: Reviewer evals (Claude)
    needs: [acceptance, security]
    runs-on: ubuntu-24.04
    # Shadow mode runs both suites twice (released + candidate reviewer).
    timeout-minutes: 40
    # Fork PRs never get the key.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check secret
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not set, skipping reviewer evals"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.key.outputs.present == 'true'
      - name: Decide (only pay for evals when the reviewer or its corpus changed)
        id: run
        if: steps.key.outputs.present == 'true'
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # No pipe into `grep -q`: under pipefail its early exit can SIGPIPE git diff and
          # make the condition false, silently skipping the evals.
          # Only what the reviewer depends on: Coach or Dojo prompts don't change its output.
          changed=$(git diff --name-only "origin/$BASE_REF" HEAD -- \
                      reviewer evals tools/injection_guard.py \
                      agents/reviewer.yaml 'agents/prompts/reviewer-*')
          if [ -n "$changed" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::reviewer, prompts and evals unchanged, skipping paid evals"
          fi
          # Shadow mode only when the reviewer itself changed: a corpus-only change would
          # compare the same reviewer with itself and double the bill for nothing.
          reviewer_changed=$(git diff --name-only "origin/$BASE_REF" HEAD -- \
                               reviewer tools/injection_guard.py \
                               agents/reviewer.yaml 'agents/prompts/reviewer-*')
          if [ -n "$reviewer_changed" ]; then
            echo "shadow=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.run.outputs.go == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - if: steps.run.outputs.go == 'true'
        run: pip install -e ".[agent]"
      - name: Seeded bugs
        if: steps.run.outputs.go == 'true'
        run: python -m evals.runner --suite seeded-bugs --reviewer reviewer.claude:review --report seeded.json
      # Runs even if the seeded-bugs gate failed: every paid run should yield both reports.
      - name: Injection
        if: ${{ !cancelled() && steps.run.outputs.go == 'true' }}
        run: python -m evals.runner --suite injection --reviewer reviewer.claude:review --report injection.json
      # The released reviewer (base branch code and prompts) on this PR's corpus, so both
      # versions see exactly the same cases. Its own gates don't matter here, only its report.
      - name: Released reviewer (shadow baseline)
        if: ${{ !cancelled() && steps.run.outputs.shadow == 'true' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add --detach ../baseline "origin/$BASE_REF"
          rm -rf ../baseline/evals/seeded-bugs ../baseline/evals/injection
          cp -r evals/seeded-bugs evals/injection ../baseline/evals/
          cd ../baseline
          # PYTHONPATH first, so imports come from the released code, not the editable
          # install of the PR.
          for suite in seeded-bugs injection; do
            PYTHONPATH="$PWD" python -m evals.runner --suite "$suite" \
              --reviewer reviewer.claude:review --report "$GITHUB_WORKSPACE/base-$suite.json" \
              > "$GITHUB_WORKSPACE/base-$suite.log" || true
          done
      - name: Shadow comparison (released vs candidate)
        if: ${{ !cancelled() && steps.run.outputs.shadow == 'true' }}
        run: |
          status=0
          python -m evals.shadow base-seeded-bugs.json seeded.json \
            --summary "$GITHUB_STEP_SUMMARY" || status=1
          python -m evals.shadow base-injection.json injection.json \
            --summary "$GITHUB_STEP_SUMMARY" || status=1
          exit "$status"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && steps.run.outputs.go == 'true'
        with:
          name: reviewer-eval-reports
          path: |
            *.json
            base-*.log
