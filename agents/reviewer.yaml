name: reviewer
version: 0.3.0
role: reviewer
advisory: true
model: claude-sonnet-5-5
modes:
  - name: fast
    stage: commit
    prompt: prompts/reviewer-fast.md
    max_diff_lines: 400
  - name: deep
    stage: validation
    prompt: prompts/reviewer-deep.md
    model: claude-opus-5-5
tools:
  - git.diff
  - git.changed_files
  - skillmap.write
